<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 6 Day 1 — Character Search</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
    />
    <style>
      /* Colors picked from the poster */
      :root {
        --portal-green: #97ce4c;
        --rick-blue: #44c8e8;
        --morty-yellow: #f0e14a;
        --summer-pink: #e868c8;
        --space-dark: #0d1f22;
        --space-teal: #1f3d3d;
        --card-dark: #16292b;
      }

      body {
        color: #e8f4f0;
        background: linear-gradient(
          180deg,
          var(--space-dark) 0%,
          var(--space-teal) 55%,
          #5a2a4a 100%
        );
        background-attachment: fixed;
        min-height: 100vh;
      }

      h1 {
        font-family: "Creepster", cursive;
        color: var(--rick-blue);
        font-size: 2.8rem;
        letter-spacing: 2px;
        text-shadow:
          0 0 6px var(--portal-green),
          0 0 18px var(--portal-green);
      }

      a {
        color: var(--portal-green);
      }
      a:hover {
        color: var(--morty-yellow);
      }

      strong {
        color: var(--morty-yellow);
      }

      .poster {
        width: 100%;
        border-radius: 12px;
        border: 3px solid var(--portal-green);
        box-shadow: 0 0 20px rgba(151, 206, 76, 0.5);
      }

      .credit {
        font-size: 0.75rem;
        color: #a9c4c0;
      }
      .credit a {
        color: #a9c4c0;
      }

      #search-box {
        background: var(--card-dark);
        color: #fff;
        border: 2px solid var(--rick-blue);
      }
      #search-box:focus {
        border-color: var(--portal-green);
        box-shadow: 0 0 0 0.25rem rgba(151, 206, 76, 0.35);
      }

      #search-btn {
        background: var(--portal-green);
        border-color: var(--portal-green);
        color: var(--space-dark);
        font-weight: bold;
      }
      #search-btn:hover {
        background: var(--morty-yellow);
        border-color: var(--morty-yellow);
      }

      #status {
      }

      /* The Retry button from the Extra */
      #status .btn-outline-dark {
        color: var(--portal-green);
        border-color: var(--portal-green);
      }
      #status .btn-outline-dark:hover {
        background: var(--portal-green);
        color: var(--space-dark);
      }

      #results .list-group-item {
        background: var(--card-dark);
        color: #e8f4f0;
        border-color: var(--space-teal);
        border-left: 4px solid var(--portal-green);
      }
    </style>
  </head>
  <body>
    <main class="container py-4" style="max-width: 900px">
      <div class="row g-4 align-items-start">
        <div class="col-md-8">
          <h1>Week 6 Day 1 — Character Search</h1>
          <p><a href="../../index.html">← All practice days</a></p>

          <p>
            Search for a Rick and Morty character, like <strong>rick</strong>,
            <strong>morty</strong> or <strong>summer</strong>.
          </p>
          <div class="d-flex gap-2 mb-3">
            <input
              id="search-box"
              type="text"
              class="form-control"
              value="rick"
            />
            <button id="search-btn" class="btn btn-dark">Search</button>
          </div>

          <!-- Messages go here: loading, error, nothing found -->
          <p id="status" class="fw-bold"></p>

          <button
            id="retry-btn"
            class="btn btn-outline-primary d-none"
            type="button"
          >
            Try again
          </button>

          <!-- Results go here -->
          <ul id="results" class="list-group"></ul>
        </div>

        <div class="col-md-4">
          <img
            class="poster"
            src="images/rick-and-morty-poster.png"
            alt="Fan art of Rick, Morty and Summer next to Rick's space cruiser"
          />
          <p class="credit mt-2">
            Art by
            <a href="https://www.deviantart.com/jd-dibujandoando"
              >JD-Dibujandoando</a
            >
            (2017),
            <a href="https://creativecommons.org/licenses/by-nc-nd/3.0/"
              >CC BY-NC-ND 3.0</a
            >.
          </p>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
