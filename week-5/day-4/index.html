<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 5 Day 4 — Recipe Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4" style="max-width: 700px;">
    <h1>Week 5 Day 4 — Recipe Finder</h1>
    <p><a href="../../index.html">← All practice days</a></p>

    <p>Type a recipe number from 1 to 50, then click the button.</p>
    <div class="d-flex gap-2 mb-3">
      <input id="recipe-id" type="number" class="form-control" value="1" min="1">
      <button id="load-btn" class="btn btn-dark">Get recipe</button>
    </div>

    <!-- Messages go here: "Loading...", "No recipe with that number"... -->
    <p id="status" class="fw-bold"></p>

    <!-- The recipe card goes here. script.js fills it. -->
    <div id="recipe"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
